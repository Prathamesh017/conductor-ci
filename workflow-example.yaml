name: PR Validation
tasks:
  - name: lint
    script: echo "Linting From Terminal..."
    retries: 0
  - name: test
    script: echo "Testing From Terminal..."
    retries: 2
  - name: build
    script: echo "Building From Terminal..."
    retries: 1
  - name: deploy
    script: echo "Deploying From Terminal..."
    retries: 0
execution:
  - stage: validation
    tasks: [lint, test]
    mode: sequential
  - stage: build
    tasks: [build]
    mode: sequential
  - stage: deploy
    tasks: [deploy]
    mode: sequential
    requires_approval: true
